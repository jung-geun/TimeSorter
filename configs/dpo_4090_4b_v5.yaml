# Stage 3 DPO v5 (Qwen3.5-4B) — RTX 4090 단일 24GB, bf16 LoRA
# 24GB는 ref forward 동시 수행 여유가 있어 precompute 불필요 (12GB 구성과의 차이)
model_name: Qwen/Qwen3.5-4B
sft_adapter: outputs/sft_q35_4b_v4
dataset: data/dpo_pairs_v5.parquet
output_dir: outputs/dpo_q35_4b_v5
max_samples: null
max_prompt_len: 800
schema_version: "v3"
wandb_run_name: dpo_q35_4b_v5_4090

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  use_4bit: false

training_args:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  num_train_epochs: 1
  max_length: 1792               # 24GB: 12GB의 1536 제한 완화
  beta: 0.1
  learning_rate: 5.0e-7
  bf16: true
  gradient_checkpointing: true
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  logging_steps: 5
  save_strategy: "steps"
  save_steps: 16
  save_total_limit: 2
  report_to: "wandb"
  remove_unused_columns: false
  dataloader_num_workers: 4
