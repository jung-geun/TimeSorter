# SFT v9-combined (Qwen3.5-4B) — R1-R7 전체 규칙 적용 데이터셋 (KR 1358 + EN 635 = 1993행)
# R7: TIER_OVERDUE 포함 (마감 초과 + 긴급 시 순위 유지)
# max_seq 4096 유지 — 문자 기준 p90=8496 ≈ 토큰 2800~3000 수준
model_name: Qwen/Qwen3.5-4B
dataset: data/scheduler_v9_combined.parquet
output_dir: outputs/sft_q35_4b_v9combined
max_samples: null
schema_version: "v9"
prompt_completion: true
max_seq_length: 3584
wandb_run_name: sft_q35_4b_v9combined

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  use_4bit: true

training_args:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  num_train_epochs: 2
  learning_rate: 2.0e-5
  gradient_checkpointing: true
  packing: false
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 1
  save_strategy: "epoch"
  report_to: "wandb"
  remove_unused_columns: false
  dataloader_num_workers: 2
  optim: "adamw_8bit"
