# Stage 3 DPO v3 — hard negative 선호 학습
# rejected가 chosen과 형식 동일·내용만 오류(날짜 혼동/체인 분산/리스크 무시/점수-순서 모순)
model_name: Qwen/Qwen3-4B-Instruct-2507
sft_adapter: outputs/sft_rtx12g_4b_v3
dataset: data/dpo_pairs_v3.parquet
output_dir: outputs/dpo_rtx12g_4b_v3
max_samples: null
max_prompt_len: 1024          # v3 system prompt(날짜 규칙 포함)가 v2보다 길다
schema_version: "v3"
wandb_run_name: dpo_rtx12g_4b_v3

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  use_4bit: true

training_args:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  num_train_epochs: 1          # hard negative는 신호가 강해 과적합 방지 위해 1 epoch
  max_length: 1792             # 실측 최대 1719 (system+user+response), 12GB OOM 방지
  precompute_ref_log_probs: true   # ref forward를 사전 계산해 학습 중 피크 메모리 절감
  beta: 0.1
  learning_rate: 5.0e-7
  gradient_checkpointing: true
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_strategy: "epoch"
  report_to: "wandb"
  remove_unused_columns: false
  dataloader_num_workers: 2
  optim: "adamw_8bit"
