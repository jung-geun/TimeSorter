# Stage 2 SFT v3 — 날짜 추론·마감 세분화·의존성·리스크 강화
# dpo v2 어댑터에서 이어 학습 — sft_rtx12g_4b_v2는 가중치 없이 설정만 커밋되어 있어
# (1affad8) 가중치가 존재하는 v2 최신 산출물인 dpo_rtx12g_4b_v2를 시작점으로 사용.
# 주의: configs v2의 "Qwen3.5-4B" 표기와 달리 어댑터 실제 베이스는 Qwen3-4B-Instruct-2507
model_name: Qwen/Qwen3-4B-Instruct-2507
sft_adapter: outputs/dpo_rtx12g_4b_v2
dataset: data/scheduler_v3_combined.parquet
output_dir: outputs/sft_rtx12g_4b_v3
max_samples: null
ko_ultrafeedback_n: 0
max_seq_length: 2048
schema_version: "v3"
wandb_run_name: sft_rtx12g_4b_v3

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  use_4bit: true

training_args:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  num_train_epochs: 2
  learning_rate: 1.0e-5        # 이어 학습이므로 v2(2e-5)보다 낮게
  gradient_checkpointing: true
  packing: true
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_strategy: "epoch"
  report_to: "wandb"
  remove_unused_columns: false
  dataloader_num_workers: 2
  optim: "adamw_8bit"
