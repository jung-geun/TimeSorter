# DPO v9 (Qwen3.5-2B) — sft_q35_2b_v9 베이스. 4B와 동일 파이프라인, model만 교체.
# 소형 모델에서도 선호학습이 실제로 되는지 검증. 약점(체인 순서) 집중셋 사용.
model_name: Qwen/Qwen3.5-2B
sft_adapter: outputs/sft_q35_2b_v9
dataset: data/dpo_pairs_v9_focus.parquet
output_dir: outputs/dpo_q35_2b_v9
max_samples: 2000
max_prompt_len: 2000
schema_version: "v9"
wandb_run_name: dpo_q35_2b_v9

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  use_4bit: true

training_args:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  num_train_epochs: 1
  max_length: 4096
  max_prompt_length: 2000
  precompute_ref_log_probs: true
  precompute_ref_batch_size: 1
  beta: 0.1
  learning_rate: 5.0e-7
  gradient_checkpointing: true
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  save_strategy: "epoch"
  save_total_limit: 1
  optim: "adamw_8bit"
  dataloader_num_workers: 2
