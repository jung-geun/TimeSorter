# Stage 4 GRPO 파일럿 — verify_chosen 골격 규칙을 검증 가능한 보상으로 사용 (RLVR)
# dpo_v3 위에서 on-policy 강화: held-out에서 모델이 실제로 틀리는 chain/past_rank를 직접 벌점
# 주의: 과거 파일럿은 Qwen3-4B-Instruct-2507 + dpo_rtx12g_4b_v3에서 수행됨 (docs/GRPO_ANALYSIS.md)
model_name: Qwen/Qwen3.5-4B
sft_adapter: outputs/sft_q35_4b_v4
dataset: data/grpo_prompts_v4.parquet     # meta 컬럼 필수 (build: scripts/build_grpo_prompts.py)
output_dir: outputs/grpo_rtx12g_4b_v4
max_samples: 256              # 파일럿: 527s/step → 32스텝 ~4.7h (HF generate 병목)
schema_version: "v3"
wandb_run_name: grpo_rtx12g_4b_v4

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  use_4bit: true

training_args:
  per_device_train_batch_size: 2      # 12GB: 학습 forward 동시 2시퀀스
  gradient_accumulation_steps: 16     # 유효 32 completion/업데이트 (4생성 그룹 단위 유지)
  num_generations: 4
  generation_batch_size: 4            # 기본값(유효 배치 32) 동시 생성은 KV 캐시 OOM — 4로 제한
  num_train_epochs: 1
  max_completion_length: 768   # trl 1.5 GRPOConfig에는 max_prompt_length 없음
  learning_rate: 2.0e-6
  beta: 0.04                          # KL 페널티 (기준: dpo_v3 정책)
  temperature: 0.9
  gradient_checkpointing: true
  logging_steps: 1
  save_strategy: "steps"       # 크래시 대비 중간 저장 (스텝당 ~9분이라 손실 비용 큼)
  save_steps: 8
  save_total_limit: 2
  report_to: "wandb"
  remove_unused_columns: false
  optim: "adamw_8bit"
