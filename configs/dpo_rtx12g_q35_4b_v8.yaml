# Stage 3 DPO v8 (Qwen3.5-4B) — v8 chain hard-negative, sft_q35_4b_v8 베이스, RTX 12GB
# 데이터: data/dpo_pairs_v8_chain.parquet (1,231쌍 — dependency_scatter/chain_internal_swap/chain_break_mid)
# max_length 1792: v8 chain 정답이 길어 v5 캡(1280) 그대로면 44.5%만 생존 → 99% 보존
# 사전 점검: chosen p50=594, p90=752, max=893 tok; full seq 최대 1666 < 1792
model_name: Qwen/Qwen3.5-4B
sft_adapter: outputs/sft_q35_4b_v8
dataset: data/dpo_pairs_v8_chain.parquet
output_dir: outputs/dpo_q35_4b_v8
max_samples: null
max_prompt_len: 800           # v5는 700; chain prompt raw는 max 193 tok — 여유
schema_version: "v3"
wandb_run_name: dpo_q35_4b_v8

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  use_4bit: true

training_args:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  num_train_epochs: 1
  max_length: 1536          # OOM 폴백(1792→1536): T=1792서 활성화 메모리 부족 — 1536도 chosen max 893tok 포함
  precompute_ref_log_probs: true
  precompute_ref_batch_size: 1
  beta: 0.1
  learning_rate: 5.0e-7
  gradient_checkpointing: true
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  logging_steps: 5
  save_strategy: "steps"
  save_steps: 16
  save_total_limit: 2
  report_to: "wandb"
  remove_unused_columns: false
  dataloader_num_workers: 2
  optim: "adamw_8bit"
