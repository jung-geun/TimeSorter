# Stage 3 DPO v5 (Qwen3.5-4B-Base) — RTX 12GB, 4bit QLoRA
# sft_q35_4b_base_v4 완료 후 실행. MemEfficientDPOTrainer 필수 (248K vocab OOM).
#
# 실행:
#   uv run python scripts/train_dpo.py --config configs/dpo_rtx12g_q35_4b_base_v5.yaml
model_name: Qwen/Qwen3.5-4B-Base
sft_adapter: outputs/sft_q35_4b_base_v4
dataset: data/dpo_pairs_v5.parquet
output_dir: outputs/dpo_q35_4b_base_v5
max_samples: null
max_prompt_len: 700
schema_version: "v3"
wandb_run_name: dpo_q35_4b_base_v5

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  use_4bit: true

training_args:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  num_train_epochs: 1
  max_length: 1280
  precompute_ref_log_probs: true
  precompute_ref_batch_size: 1
  beta: 0.1
  learning_rate: 5.0e-7
  gradient_checkpointing: true
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  logging_steps: 5
  save_strategy: "steps"
  save_steps: 16
  save_total_limit: 2
  report_to: "wandb"
  remove_unused_columns: false
  dataloader_num_workers: 2
  optim: "adamw_8bit"
